<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
<div class="display-container">
<div id="history" class="display-history"></div>
<div id="display" class="display-current">0</div>
</div>

<div class="buttons">
<!-- Row 1: C (2 cols), Delete (1 col), Divide (1 col) -->
<button class="btn clear" id="Clear">C</button>
<button class="btn backspace" id="backspace">⌫</button>
<button class="btn operator" data-operator="/">/</button>

<!-- Row 2 -->
<button class="btn digit">7</button>
<button class="btn digit">8</button>
<button class="btn digit">9</button>
<button class="btn operator" data-operator="*">*</button>

<!-- Row 3 -->
<button class="btn digit">4</button>
<button class="btn digit">5</button>
<button class="btn digit">6</button>
<button class="btn operator" data-operator="-">−</button>

<!-- Row 4 -->
<button class="btn digit">1</button>
<button class="btn digit">2</button>
<button class="btn digit">3</button>
<button class="btn operator" data-operator="+">+</button>

<!-- Row 5 -->
<button class="btn digit zero">0</button>
<button class="btn digit decimal" id="decimal">.</button>
<button class="btn equals" id="equals">=</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
